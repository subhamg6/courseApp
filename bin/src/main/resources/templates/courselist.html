<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            color: #333;
        }
        .container {
            width: 94%;
            max-width: 1280px;
            margin: 50px auto;
            background: white;
            border-radius: 18px;
            border-top: 6px solid #2874e8;
            padding: 45px 34px 35px;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
        }
        h1 {
            text-align: center;
            color: #163b7a;
            font-size: 32px;
            margin: 0 0 35px;
        }
        .top {
            border-top: 1px solid #ddd;
            padding-top: 24px;
        }
        .add {
            display: inline-block;
            text-decoration: none;
            background: #2874e8;
            color: white;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 25px;
            box-shadow: 0 5px 12px rgba(40,116,232,.3);
            margin-bottom: 28px;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 12px;
            font-size: 15px;
        }
        th {
            background: #2358c7;
            color: white;
            text-align: left;
            padding: 15px;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        tr:last-child td { border-bottom: none; }
        tbody tr:nth-child(even) { background: #e9f2ff; }
        .action {
            display: inline-block;
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 9px 20px;
            border-radius: 20px;
            margin-right: 8px;
            font-size: 13px;
        }
        .update { background: #19c463; }
        .delete { background: #e52c2c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Course Management</h1>

        <div class="top">
            <!-- Controller mapping: @GetMapping("/showCourseForm") -->
            <a class="add" href="/showCourseForm">Add New Course</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Trainer</th>
                    <th>Duration</th>
                    <th>Fees</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="course : ${Courses}">
                    <td th:text="${course.courseName}">Java</td>
                    <td th:text="${course.trainerName}">Navin Reddy</td>
                    <td th:text="${course.duration}">100</td>
                    <td th:text="${course.fees}">10000.0</td>
                    <td>
                        <!-- Controller mapping: @GetMapping("/updateCourseForm") -->
<!--                        <a href="/updateCourseForm" class="action update">Update</a>-->

                        <!-- Controller mapping: @GetMapping("/deleteCourse") with @RequestParam id -->
                        <a th:href="@{/deleteCourse(id=${course.id})}"
                           class="action delete"
                           onclick="return confirm('Are you sure you want to delete this course?');">
                            Delete
                        </a>
                        <a th:href="@{/updateCourseForm(id=${course.id})}"
                           class="action update">
                            Update
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
