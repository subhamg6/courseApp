<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            color: #333;
        }
        .container {
            width: 70%;
            max-width: 1050px;
            margin: 50px auto;
            background: white;
            border-radius: 18px;
            border-top: 6px solid #2874e8;
            padding: 45px 38px 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
        }
        h1 {
            text-align: center;
            color: #163b7a;
            font-size: 32px;
            margin: 0 0 42px;
        }
        label {
            display: block;
            font-size: 17px;
            margin: 0 0 10px;
        }
        input {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            margin-bottom: 25px;
        }
        input:focus {
            outline: none;
            border-color: #2874e8;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        button, .cancel {
            border: none;
            border-radius: 25px;
            padding: 13px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }
        .save {
            background: #19c463;
            box-shadow: 0 5px 12px rgba(25,196,99,.3);
        }
        .cancel {
            background: #63748a;
            box-shadow: 0 5px 12px rgba(99,116,138,.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Course Details</h1>

        <!-- Controller mapping: @PostMapping("/registerCourse") -->
        <form action="/registerCourse" method="post">
            <input type="hidden" name="id" th:value="${course.id}">

            <label for="courseName">Course Name</label>
            <input id="courseName" name="courseName" type="text"
                   placeholder="Enter course name" required>

            <label for="trainerName">Trainer Name</label>
            <input id="trainerName" name="trainerName" type="text"
                   placeholder="Enter trainer name" required>

            <label for="duration">Duration (in hours)</label>
            <input id="duration" name="duration" type="number"
                   placeholder="Enter duration" required>

            <label for="fees">Fees</label>
            <input id="fees" name="fees" type="number" step="0.01"
                   placeholder="Enter fees" required>

            <div class="buttons">
                <button class="save" type="submit">Save Course</button>
                <a class="cancel" href="/courselist">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
